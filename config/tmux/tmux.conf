# General
unbind C-b
set -g prefix '^'
bind '^' send-prefix

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g allow-rename off

# Windows and panes
unbind '"'
unbind %
unbind '-'
unbind '|'
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3
bind -r C-h previous-window
bind -r C-l next-window

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind b set-option -g status

# Copy mode (Vim + macOS clipboard)
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Appearance uses Ghostty's ANSI palette for automatic light/dark support.
set -g status-position bottom
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 30
set -g status-style "fg=colour8,bg=colour0"

# Clear custom multi-line formats retained by a running tmux server.
set -gu status-format
set -g status-left ""
set -g status-right "#[fg=colour2,bold]  #S  "

setw -g window-status-separator "  "
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format "  #I:#W  "
setw -g window-status-style "fg=colour8"
setw -g window-status-current-style "fg=colour2,bold"

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour2"
set -g message-style "reverse,bold"
set -g mode-style "reverse,bold"
set -g display-panes-colour colour8
set -g display-panes-active-colour colour2
